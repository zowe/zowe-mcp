version: 2
updates:
  # npm dependencies across the workspace root. Grouped to keep PR volume low:
  # one PR for dev-dependency bumps, one for production. Security updates are
  # always raised individually by Dependabot regardless of grouping.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    ignore:
      # TS 7 (the Go-native "tsgo" compiler) isn't supported by
      # typescript-eslint yet, which breaks `npm ci` (ERESOLVE). Remove once
      # typescript-eslint ships a compatible major version.
      - dependency-name: 'typescript'
        versions: ['>=7.0.0']

  # Keep GitHub Actions current (replaces manual SHA-pinning of actions).
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
