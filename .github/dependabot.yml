version: 2
updates:
  # npm dependencies across the workspace root. Grouped to keep PR volume low:
  # one PR for dev-dependency bumps, one for production. Security updates are
  # always raised individually by Dependabot regardless of grouping.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    ignore:
      # Held at 5.9.x pending a deliberate TS 7 migration. TS 6.0+ makes
      # our tsconfigs' `moduleResolution: node` (node10) a hard error
      # (TS5107); TS 7 (the Go-native "tsgo" compiler) also isn't supported
      # by typescript-eslint yet, which breaks `npm ci` (ERESOLVE). Fix the
      # moduleResolution config and confirm typescript-eslint support, then
      # remove this rule and bump straight to 7.
      - dependency-name: 'typescript'
        versions: ['>=6.0.0']

  # Keep GitHub Actions current (replaces manual SHA-pinning of actions).
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
