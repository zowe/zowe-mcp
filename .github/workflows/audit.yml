name: Audit

# Dependency vulnerability scan. Runs on every PR and once daily so newly
# disclosed advisories surface even without a code change. Production deps
# only, failing at moderate+ except explicitly reviewed, expiring advisories.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 10 * * *'

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Test production audit policy
        run: npm run test:audit

      - name: npm audit (production, moderate+)
        run: npm run audit:prod
