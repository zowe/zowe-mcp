name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      sdk-mode:
        description: 'SDK source (fallback, nightly, release, pr, branch)'
        required: false
        default: 'fallback'
        type: choice
        options:
          - fallback
          - nightly
          - release
          - pr
          - branch
      sdk-arg:
        description: 'Argument for the SDK mode (version, PR number, or branch name)'
        required: false
        type: string

# Least privilege: the sticky PR comment needs pull-requests write, the JUnit
# test reporter needs checks write, and the ESLint SARIF upload needs
# security-events write; everything else reads.
permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: "!contains(github.event.head_commit.message || '', '[ci skip]')"

    env:
      NODE_OPTIONS: --max_old_space_size=4096

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Default path (push / PR / dispatch with fallback): install strictly from
      # the committed lockfile, which already pins the fallback zowex-sdk. Use
      # --ignore-scripts because the prebuilt zowex-sdk tarball ships no build
      # step and other deps' install scripts are not needed here (VS Code API
      # types are fetched explicitly below).
      - name: Install dependencies (npm ci)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.sdk-mode != 'fallback') }}
        run: npm ci --ignore-scripts

      # Custom SDK source (manual dispatch only): sdk-switch rewrites the server
      # dependency to the chosen tarball and runs its own install, so npm ci is
      # skipped on this path.
      - name: Switch zowex-sdk and install (custom SDK mode)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sdk-mode != 'fallback' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sdk-switch.js ${{ inputs.sdk-mode }} ${{ inputs.sdk-arg }}

      - name: Environment info
        run: |
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "tsc: $(npx tsc --version)"
          echo "OS: $(uname -srm)"
          echo "RAM: $(free -h | grep Mem | awk '{print $2}')"

      - name: Download VS Code API types
        run: npm run download-api -w packages/zowe-mcp-vscode

      - name: Lint Markdown
        run: npm run lint:md

      - name: Check formatting (Prettier + shfmt)
        run: npm run check-format

      - name: Check code duplication (jscpd)
        run: npm run duplication

      - name: Build (common + server)
        run: |
          npm run build -w packages/zowe-mcp-common
          npm run build -w @zowe/mcp-server

      # Type-check every package including its tests (dev tsconfig, --noEmit).
      # common + server are already built above, so run the workspace scripts
      # directly rather than the root script (which would rebuild them).
      - name: Type-check (incl. tests)
        run: npm run typecheck --workspaces --if-present

      - run: npm run lint

      # Emit an ESLint SARIF report and upload it to code scanning, so lint
      # findings appear in the Security tab and as inline PR annotations. The
      # hard gate above (`npm run lint`, --max-warnings 0) is what blocks the
      # build; this is visibility-only and never fails the job. Runs even if the
      # gate failed (!cancelled) so the annotations show up exactly when needed.
      - name: ESLint SARIF report
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run lint:sarif
      - name: Upload ESLint SARIF
        # security-events:write is unavailable to fork-PR tokens — skip there.
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif
          category: eslint

      # Server tests with coverage (report-only — no threshold gate) and a
      # JUnit file for the PR checks UI. e2e suites self-skip without their
      # env gates (ZOWE_MCP_KEYCLOAK_E2E, ZOWE_MCP_RUN_NATIVE_STDIO_E2E, ...).
      - name: Test (server, coverage + JUnit)
        run: >
          npm run test -w @zowe/mcp-server --
          --coverage --coverage.reporter=text-summary
          --coverage.reporter=html --coverage.reporter=json-summary
          --reporter=default --reporter=junit
          --outputFile.junit=test-results.junit.xml

      - name: Publish test results
        uses: dorny/test-reporter@v2
        # Needs checks:write — skip for fork PRs (their token is read-only).
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          name: Server test results
          path: packages/zowe-mcp-server/test-results.junit.xml
          reporter: java-junit

      # Surface coverage on the run Summary page (next to the test report)
      # so nobody has to dig through the step log.
      - name: Coverage summary
        run: |
          node -e "
          const t = require('./packages/zowe-mcp-server/coverage/coverage-summary.json').total;
          const row = k => \`| \${k[0].toUpperCase()+k.slice(1)} | \${t[k].pct}% | \${t[k].covered}/\${t[k].total} |\`;
          const lines = ['## Server coverage (report-only)', '', '| Metric | Coverage | Covered/Total |', '| --- | --- | --- |'];
          for (const k of ['statements','branches','functions','lines']) lines.push(row(k));
          require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          "

      - name: Upload coverage report (HTML)
        uses: actions/upload-artifact@v7
        id: coverage-upload
        with:
          name: coverage-report
          path: packages/zowe-mcp-server/coverage

      # VS Code extension tests (@vscode/test-cli downloads VS Code; needs a
      # display on Linux, hence xvfb-run). The download is cached.
      - name: Cache VS Code test download
        uses: actions/cache@v4
        with:
          path: packages/zowe-mcp-vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('packages/zowe-mcp-vscode/package.json') }}

      - name: Test (VS Code extension)
        run: xvfb-run -a npm run test:vscode

      - name: Pack @zowe/mcp-server (npm tarball)
        run: npm pack -w @zowe/mcp-server --pack-destination .

      # Airgapped-install test: installs the freshly packed tarball with an
      # empty npm cache, an invalid registry, and a 5ms network timeout, then
      # smoke-runs the binary — proves the tarball is fully self-contained.
      - name: Test airgapped install (packed tarball)
        run: npm run test:airgap

      - name: Upload npm package tarball
        uses: actions/upload-artifact@v7
        id: npm-pack-upload
        with:
          name: zowe-mcp-server-npm
          path: zowe-mcp-server-*.tgz
          if-no-files-found: error

      - name: Generate MCP reference docs
        run: npm run generate-docs

      # Docs-drift gate: the generator is deterministic (pinned mock clock, no
      # commit hash in the header), so regenerating must not change the committed
      # reference docs. If this fails, run `npm run generate-docs` and commit.
      - name: Check MCP reference docs are up to date
        run: git diff --exit-code docs/mcp-reference.md vendor/zowe/docs/mcp-reference-vendor.md

      - name: Build VS Code extension (VSIX)
        run: npm run package -w packages/zowe-mcp-vscode

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        id: vsix-upload
        with:
          name: vsix
          path: packages/zowe-mcp-vscode/*.vsix

      - name: Upload MCP reference docs
        uses: actions/upload-artifact@v7
        id: docs-upload
        with:
          name: mcp-reference
          path: docs/mcp-reference.md

      - name: Comment on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: Build artifacts
          number: ${{ github.event.pull_request.number }}
          message: |
            Build artifacts:
             - VS Code Extension (VSIX): ${{ steps.vsix-upload.outputs.artifact-url }}
             - MCP server npm package (.tgz): ${{ steps.npm-pack-upload.outputs.artifact-url }}
             - MCP Reference Docs: ${{ steps.docs-upload.outputs.artifact-url }}
             - Server coverage report (HTML): ${{ steps.coverage-upload.outputs.artifact-url }}

  # Cross-platform verification on Windows and macOS. The full build job above
  # runs on Linux (it owns the packaging/release/coverage steps); this leg runs
  # only the portable parts — build, type-check, server tests, and the VS Code
  # extension tests — to catch path-separator, line-ending, and case-sensitivity
  # bugs the extension/CLI hit on users' machines. Ubuntu is already covered by
  # `build`. fail-fast: false so one OS failing doesn't cancel the other.
  cross-platform:
    name: Cross-platform (${{ matrix.os }})
    if: "!contains(github.event.head_commit.message || '', '[ci skip]')"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    env:
      NODE_OPTIONS: --max_old_space_size=4096

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci --ignore-scripts

      - name: Download VS Code API types
        run: npm run download-api -w packages/zowe-mcp-vscode

      - name: Build (common + server)
        run: |
          npm run build -w packages/zowe-mcp-common
          npm run build -w @zowe/mcp-server

      - name: Type-check (incl. tests)
        run: npm run typecheck --workspaces --if-present

      # --no-file-parallelism avoids the cross-platform integration-test
      # contention documented in AGENTS.md (observed hanging on macOS).
      - name: Test (server)
        run: npm run test -w @zowe/mcp-server -- --no-file-parallelism

      # No xvfb here: @vscode/test-electron runs headless natively on
      # Windows/macOS runners (xvfb is Linux-only).
      - name: Test (VS Code extension)
        run: npm run test:vscode

  # Aggregate gate: one stable check name for branch protection to require, so
  # adding, renaming, or sharding the CI jobs above never churns the protection
  # config (only a brand-new *workflow* would). Runs even when an upstream job
  # failed or was skipped (if: always()) and fails only if a needed job actually
  # failed or was cancelled. A skipped job — e.g. a `[ci skip]` push, where build
  # and cross-platform are guarded off — counts as a pass, so `[ci skip]` commits
  # still satisfy the required check.
  ci-ok:
    name: ci-ok
    needs: [build, cross-platform]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required CI jobs succeeded
        run: |
          echo "build          = ${{ needs.build.result }}"
          echo "cross-platform = ${{ needs.cross-platform.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::A required CI job failed or was cancelled."
            exit 1
          fi
          echo "All required CI jobs passed (or were skipped)."
