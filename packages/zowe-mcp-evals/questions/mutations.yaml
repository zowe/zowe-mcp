# yaml-language-server: $schema=../schemas/evals-question-set.schema.json
# Mutation evals: write and delete (temp data sets so mock state is cleaned up).
config:
  name: mutations
  description: Agent must create temp data sets, write content, delete members, and clean up
  repetitions: 5
  minSuccessRate: 0.8
  mock:
    initArgs: --preset minimal

questions:
  - id: write-temp-then-read
    prompt: Create a temporary sequential data set, write the single line "Evals write test" to it, read it back, and tell me what the first line says. Then delete all data sets under that temp prefix.
    assertions:
      - name: create temp, write, read, cleanup
        toolCallOrder:
          # Accept either create tool (createTempDataset, or createDataset under a
          # fetched temp prefix) — both are valid and both clean up via the prefix.
          - tools:
              - createTempDataset
              - createDataset
          - tool: writeDataset
            args:
              lines: ['Evals write test']
          - tool: readDataset
          - tool: deleteDatasetsUnderPrefix
      - answerContains:
          substring: 'Evals write test'

  - id: create-pds-write-member-delete-member-cleanup
    prompt: First create a temporary PDS with createTempDataset, then add member EVALMEM with content "temp content" using writeDataset, then delete that member with deleteDataset, then delete all data sets under that temp prefix with deleteDatasetsUnderPrefix.
    assertions:
      - name: create temp PDS, write member, delete member, cleanup
        toolCallOrder:
          - tool: createTempDataset
            args:
              type:
                - 'PO'
                - 'PO-E'
                - 'PDS'
                - 'PDSE'
                - 'LIBRARY'
          - tool: writeDataset
            args:
              lines: ['temp content']
          - tool: deleteDatasetsUnderPrefix
      - answerContains:
          pattern: 'success|deleted|complete|done|cleaned|removed|finished|successfully'

  - id: write-multiline-temp-read
    prompt: Create a temporary sequential data set, write these three lines to it - "LINE ONE", "LINE TWO", "LINE THREE" - then read it back and tell me what the second line is. Finally delete all data sets under that temp prefix.
    assertions:
      - name: create temp, write three lines, read, cleanup
        toolCallOrder:
          - tools:
              - createTempDataset
              - createDataset
          - tool: writeDataset
            args:
              lines: ['LINE ONE', 'LINE TWO', 'LINE THREE']
          - tool: readDataset
          - tool: deleteDatasetsUnderPrefix
      - answerContains:
          pattern: 'LINE TWO|second line is.*TWO|TWO'

  - id: create-pds-two-members-list-cleanup
    prompt: Create a temporary PDS, add two members MEMA and MEMB (each with the single line "hello"), then list the members of that PDS, and finally delete all data sets under that temp prefix.
    assertions:
      # Step 1 accepts either create tool: the agent may allocate the PDS with
      # createTempDataset, or with createDataset under a temp prefix it fetched from
      # getTempDatasetPrefix. Both are valid and both clean up via the temp prefix.
      - name: create temp PDS, write two members, list, cleanup
        toolCallOrder:
          - tools:
              - createTempDataset
              - createDataset
          - tool: writeDataset
          - tool: writeDataset
          - tool: listMembers
          - tool: deleteDatasetsUnderPrefix
      - answerContains:
          pattern: 'MEMA|MEMB|member|deleted|success'

  - id: delete-one-member-keep-other-cleanup
    prompt: Create a temporary PDS, add members KEEPME and DROPME (each containing "x"), then delete only member DROPME with deleteDataset, and finally delete all data sets under that temp prefix.
    assertions:
      - name: create temp PDS, two members, delete one, cleanup
        toolCallOrder:
          - tools:
              - createTempDataset
              - createDataset
          - tool: writeDataset
          - tool: writeDataset
          - tool: deleteDataset
          - tool: deleteDatasetsUnderPrefix
      - answerContains:
          pattern: 'KEEPME|DROPME|member|deleted|removed|success'
